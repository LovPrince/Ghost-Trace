name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - run: gradle assembleDebug --no-daemon -Pandroid.useAndroidX=true -Pandroid.nonTransitiveRClass=true
      - uses: actions/upload-artifact@v4
        with:
          name: GhostTrace-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
